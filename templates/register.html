{% extends "base.html" %}

{% block title %}Register - BookShelf{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-container">
        <h1>Create Your Account</h1>
        <p class="auth-subtitle">Join BookShelf and start tracking your reading journey</p>

        <form method="POST" action="{{ url_for('register') }}" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required 
                       minlength="3" maxlength="80" placeholder="Choose a username">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required 
                       maxlength="120" placeholder="your.email@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required 
                       minlength="8" placeholder="At least 8 characters">
                <small>Password must be at least 8 characters long</small>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" 
                       required minlength="8" placeholder="Re-enter your password">
            </div>

            <button type="submit" class="btn btn-primary btn-full">Create Account</button>
        </form>

        <p class="auth-switch">
            Already have an account? <a href="{{ url_for('login') }}">Sign in here</a>
        </p>
    </div>
</div>
{% endblock %}
