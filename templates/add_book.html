{% extends "base.html" %}

{% block title %}Add Book - BookShelf{% endblock %}

{% block content %}
<div class="add-book-page">
    <div class="container">
        <h1>Add a New Book</h1>
        <p class="page-subtitle">Help grow our community database by adding a book</p>

        <form method="POST" action="{{ url_for('add_book') }}" enctype="multipart/form-data" class="book-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="title">Title *</label>
                    <input type="text" id="title" name="title" required maxlength="200" 
                           placeholder="Enter book title">
                </div>
                
                <div class="form-group">
                    <label for="author">Author *</label>
                    <input type="text" id="author" name="author" required maxlength="200" 
                           placeholder="Enter author name">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="isbn">ISBN</label>
                    <input type="text" id="isbn" name="isbn" maxlength="20" 
                           placeholder="ISBN number (optional)">
                </div>
                
                <div class="form-group">
                    <label for="genre">Genre</label>
                    <input type="text" id="genre" name="genre" maxlength="100" 
                           placeholder="Fiction, Mystery, Biography, etc.">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="publisher">Publisher</label>
                    <input type="text" id="publisher" name="publisher" maxlength="200" 
                           placeholder="Publisher name">
                </div>
                
                <div class="form-group">
                    <label for="publication_year">Publication Year</label>
                    <input type="number" id="publication_year" name="publication_year" 
                           min="1000" max="2030" placeholder="YYYY">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="pages">Pages</label>
                    <input type="number" id="pages" name="pages" 
                           min="1" max="10000" placeholder="Total page count">
                    <small>Helps with progress tracking</small>
                </div>
                
                <div class="form-group">
                    <!-- Empty to maintain grid layout -->
                </div>
            </div>
            
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="5" 
                          placeholder="Brief description or synopsis of the book"></textarea>
            </div>
            
            <div class="form-group">
                <label for="cover_image">Cover Image</label>
                <input type="file" id="cover_image" name="cover_image" accept="image/*">
                <small>Accepted formats: JPG, PNG, GIF (max 5MB)</small>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-large">Add Book</button>
                <a href="{{ url_for('search') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
